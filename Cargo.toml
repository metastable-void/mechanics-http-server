[package]
name = "mechanics-http-server"
version = "0.1.4"
edition = "2024"
rust-version = "1.88"
authors = ["metastable-void"]
description = "Opportunistic HTTP/3 (QUIC) listener and Alt-Svc middleware for mechanics-family servers, with aws-lc-rs as the sole crypto provider."
license = "Apache-2.0 OR MPL-2.0"
readme = "README.md"
repository = "https://github.com/metastable-void/mechanics-http-server"
homepage = "https://github.com/metastable-void/mechanics-http-server"
keywords = ["http", "http3", "quic", "server", "aws-lc-rs"]
categories = ["network-programming", "web-programming::http-server"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio"] }
bytes = { version = "1", default-features = false, features = ["std"] }
h3 = { version = "0.0.8", default-features = false, features = [] }
h3-quinn = { package = "mechanics-h3-quinn", version = "0.0.10", default-features = false, features = [] }
http = { version = "1", default-features = false, features = ["std"] }
http-body = { version = "1", default-features = false }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
thiserror = { version = "2", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt", "sync", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
http-body-util = { version = "0.1", default-features = false, features = [] }
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
overflow-checks = true
